services:
  @@NAME@@:
    image: @@IMAGE@@:latest
    container_name: @@NAME@@
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
