server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Static site: no uploads or long-lived requests.
    client_max_body_size 1k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 10s;
    keepalive_timeout 15s;

    # Headers are set only at server level: any add_header inside a location
    # would stop these from being inherited there.
    include /etc/nginx/csp.conf;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # Per-site additions (redirects, cache headers, extra locations) are
    # copied into /etc/nginx/site.d/ by the site image. An add_header inside
    # a location there drops the security headers above for that location.
    include /etc/nginx/site.d/*.conf;

    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # No dotfiles (.git, .env, ...) even if one ends up in the image.
    location ~ /\. {
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
