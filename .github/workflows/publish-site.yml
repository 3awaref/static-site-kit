name: Publish site image

# Reusable workflow for site repos. Builds the repo's Dockerfile, smoke-tests
# the container, then publishes ghcr.io/<owner>/<repo> (pull requests build
# and test only). Callers need `permissions: packages: write`.
on:
  workflow_call:
    inputs:
      platforms:
        type: string
        default: linux/amd64,linux/arm64

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      # Before the build: also needed to pull the base image if it's private.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          pull: true
          load: true
          tags: site:test

      - name: Smoke test
        run: |
          docker run --rm site:test nginx -t
          docker run -d --name smoke -p 8080:80 site:test
          for i in $(seq 10); do curl -fsS http://127.0.0.1:8080/healthz && break; sleep 1; done
          curl -fsS -D headers.txt -o /dev/null http://127.0.0.1:8080/
          cat headers.txt
          grep -qi '^content-security-policy: default-src' headers.txt
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8080/)" = 405
          docker rm -f smoke

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          pull: true
          push: ${{ github.event_name != 'pull_request' }}
          platforms: ${{ inputs.platforms }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
